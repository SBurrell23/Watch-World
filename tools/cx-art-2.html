<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Complication art 2</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/complications-art.css">
<style>
  body { margin: 0; padding: 16px; background: var(--bg, #0d0c0a); color: var(--text, #eee); font-family: var(--font-body, system-ui); }
  h2 { font-size: 13px; font-weight: 500; margin: 18px 0 8px; color: var(--text-muted, #aaa); }
  .grid { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
  figure { margin: 0; text-align: center; font-size: 10px; color: var(--text-muted, #aaa); }
  .s160 .cx-art { width: 160px; } .s90 .cx-art { width: 90px; }
  button { position: fixed; top: 10px; right: 10px; z-index: 2; }
</style>
</head>
<body>
<button id="t">toggle theme</button>
<h2>160px</h2><div class="grid s160" id="g1"></div>
<h2>90px</h2><div class="grid s90" id="g2"></div>
<script type="module">
import art from '../js/complications/art-2.js';
let n = 0;
const big = new URLSearchParams(location.search).get('size');
if (big) document.head.insertAdjacentHTML('beforeend', `<style>.grid .cx-art{width:${big}px}</style>`);
for (const g of ['g1', 'g2']) for (const [id, fn] of Object.entries(art)) {
  const f = document.createElement('figure');
  f.innerHTML = `<div class="cx-art">${fn({ uid: 'u' + ++n + '_' })}</div><figcaption>${id} ${(fn({ uid: 'x' }).length / 1024).toFixed(1)}KB</figcaption>`;
  document.getElementById(g).append(f);
}
const ids = [...document.querySelectorAll('[id]')].map((e) => e.id);
const dup = ids.filter((x, i) => ids.indexOf(x) !== i);
console.log('count', Object.keys(art).length, 'dups', JSON.stringify(dup));
t.onclick = () => { const h = document.documentElement; h.dataset.theme = h.dataset.theme === 'light' ? 'dark' : 'light'; };
</script>
</body>
</html>
