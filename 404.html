<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch World · Redirecting</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    // GitHub Pages serves this file for unknown paths. Each hop climbs one folder ("./", or
    // "../" when the path ends in a slash), so it settles on the site root for user and
    // project sites alike without looping. Any #/route in the address is kept.
    location.replace((/\/$/.test(location.pathname) ? '../' : './') + (location.hash || ''));
  </script>
  <meta http-equiv="refresh" content="1; url=./">
  <style>
    html { background: #0b0a08; color: #efe6d2; font: 16px/1.6 Georgia, 'Times New Roman', serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; text-align: center; }
    a { color: #d4b06a; }
  </style>
</head>
<body>
  <p>This page has stopped ticking. <a href="./">Return to Watch World</a>.</p>
</body>
</html>
